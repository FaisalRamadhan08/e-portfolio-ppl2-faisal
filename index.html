<!DOCTYPE html>
<html lang="id" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Portfolio PPL II | Faisal Fajar Ramadhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050b14;--bg2:#0a1628;--card:rgba(15,31,61,.62);--bd:rgba(255,255,255,.14);--ac:#22D3EE;--ac2:#60A5FA;--ac3:#34d399;--warn:#fbbf24;--bad:#f87171;--tx:#e2e8f0;--mu:#94a3b8;--gl:rgba(34,211,238,.18)}
body[data-pg=uts]{--bg:#17112B;--bg2:#211a3d;--card:rgba(44,30,82,.55);--ac:#A78BFA;--ac2:#F472B6;--gl:rgba(167,139,250,.2)}
body[data-pg=uas]{--bg:#071F1B;--bg2:#0b2b26;--card:rgba(10,52,45,.55);--ac:#34D399;--ac2:#F3C677;--gl:rgba(52,211,153,.18)}
:root[data-theme=light]{--bg:#f1f6fb;--bg2:#dbeafe;--card:rgba(255,255,255,.78);--bd:rgba(15,23,42,.14);--tx:#1e293b;--mu:#475569}
:root[data-theme=light] body[data-pg=uts]{--bg:#f4f0ff}:root[data-theme=light] body[data-pg=uas]{--bg:#effaf5}
:root[data-theme=light] .btn{color:#06121c}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:120px;height:100%}
body{font:16px/1.7 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;min-height:100%;transition:background .5s}
a{color:inherit;text-decoration:none}ul{list-style:none}button{font-family:inherit;cursor:pointer}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:60px 60px;opacity:.35}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;animation:fl 12s ease-in-out infinite}
.o1{width:480px;height:480px;background:var(--ac);opacity:.14;top:-120px;left:-100px}.o2{width:420px;height:420px;background:var(--ac2);opacity:.12;bottom:-100px;right:-80px;animation-delay:-5s}
@keyframes fl{50%{transform:translate(30px,-30px)}}
nav{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;margin:8px auto 0;max-width:1100px;width:calc(100% - 20px);display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.logo{font:800 1.05rem Syne,sans-serif;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pills{display:flex;gap:4px;margin-left:auto}.pills a{padding:7px 14px;border-radius:99px;font-weight:700;font-size:.82rem;color:var(--mu)}.pills a.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121c}
.tg{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.sub{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:40;max-width:1100px;margin:6px auto 0;padding:0 14px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sub a{white-space:nowrap;font:500 .74rem 'JetBrains Mono',monospace;padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sub a:hover{color:var(--ac);border-color:var(--ac)}
main{position:relative;z-index:1}.wrap{max-width:1100px;margin:auto;padding:0 18px}
section{padding:64px 0 10px}
.lbl{font:500 .75rem 'JetBrains Mono',monospace;color:var(--ac);letter-spacing:.1em;margin-bottom:6px}
.ttl{font:800 clamp(1.7rem,4.5vw,2.6rem)/1.15 Syne,sans-serif;margin-bottom:10px}.ttl span{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.dv{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--ac2));margin:10px 0 18px}
.lead{color:var(--mu);max-width:680px;margin-bottom:26px;font-size:.95rem}
.hero{min-height:78vh;display:flex;align-items:center;padding:50px 0}.hg{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;font:500 .72rem 'JetBrains Mono',monospace;color:var(--ac);border:1px solid var(--bd);background:var(--card);margin-bottom:18px}.badge i{width:8px;height:8px;border-radius:50%;background:var(--ac3);box-shadow:0 0 10px var(--ac3)}
.hn{font:800 clamp(2.2rem,6vw,4rem)/1.05 Syne,sans-serif}.hn b{display:block;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.typ{font:500 1rem 'JetBrains Mono',monospace;color:var(--ac);margin:14px 0;min-height:1.6em}.hq{color:var(--mu);max-width:560px;font-size:.95rem}
.btn{display:inline-block;margin:18px 10px 0 0;padding:11px 22px;border-radius:12px;font-weight:700;font-size:.88rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121c;border:0}.btn.g{background:none;border:1px solid var(--ac);color:var(--ac)}.btn.s{padding:8px 16px;margin-top:10px;font-size:.8rem}
.ph-photo{position:relative;border-radius:30px;padding:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 60px var(--gl)}.ph-photo img{width:100%;display:block;border-radius:24px;aspect-ratio:4/5;object-fit:cover;background:var(--bg2)}
.ph-photo em{position:absolute;bottom:20px;left:20px;font:600 .75rem 'JetBrains Mono',monospace;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-style:normal}
.card,.bento>div{padding:24px;border-radius:22px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}.card h3,.bento h3{font:700 1.1rem Syne,sans-serif;margin-bottom:8px}.card p,.bento p{color:var(--mu);font-size:.9rem;margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.bento .pf{grid-row:span 2;text-align:center}.bento .pf img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.tag{font:500 .7rem 'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;background:var(--gl);color:var(--ac)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--bd)}.info small{display:block;color:var(--mu);font:500 .66rem 'JetBrains Mono',monospace;text-transform:uppercase}.info b{font-size:.88rem}
.tl{position:relative;padding-left:30px;border-left:2px solid var(--bd);margin-left:8px}.tl>div{position:relative;margin-bottom:22px}.tl>div:before{content:"";position:absolute;left:-39px;top:26px;width:16px;height:16px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.cy{font:500 .68rem 'JetBrains Mono',monospace;color:var(--ac)}.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tab{padding:9px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-weight:600;font-size:.82rem}.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121c;border-color:transparent}
.pn{display:none}.pn.on{display:block;animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.acc{border-radius:22px;background:var(--card);border:1px solid var(--bd);margin-bottom:16px;overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px;background:none;border:0;color:var(--tx);text-align:left;font:700 1.02rem Syne,sans-serif}.acc>button small{display:block;font:500 .68rem 'JetBrains Mono',monospace;color:var(--ac)}
.acc>button:after{content:"+";font-size:1.5rem;color:var(--ac);transition:.3s}.acc.open>button:after{transform:rotate(45deg)}
.ab{display:none;padding:0 24px 24px;gap:14px}.acc.open .ab{display:grid}
.ev{padding:16px 18px;border-radius:16px;border:1px solid;font-size:.88rem}.ev b{display:block;margin-bottom:4px}.ev.p{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.07)}.ev.c{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}.ev.k{border-color:var(--bd);background:rgba(255,255,255,.04)}
.ph{display:block;color:var(--ac2);border:1px dashed var(--ac2);border-radius:10px;padding:8px 12px;font-size:.82rem;margin-top:8px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.steps span{font:500 .68rem 'JetBrains Mono',monospace;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}.steps span:not(:last-child):after{content:" →";color:var(--ac)}
.vid{aspect-ratio:16/9;border-radius:24px;border:1px solid var(--bd);display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(135deg,rgba(0,0,0,.45),var(--card))}.vid .pl{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:1.8rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121c}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--bd);vertical-align:top}th{font:600 .72rem 'JetBrains Mono',monospace;color:var(--ac);text-transform:uppercase}td{color:var(--mu)}.tw{overflow-x:auto;border-radius:18px;border:1px solid var(--bd);background:var(--card);padding:6px}
.qt{font-size:1.15rem;font-style:italic;max-width:760px;padding:26px;border-left:4px solid var(--ac);border-radius:0 18px 18px 0;background:var(--card);margin-top:14px}
.cta{text-align:center;padding:50px 20px;margin:40px 0;border-radius:28px;border:1px solid var(--bd);background:var(--card)}
footer{text-align:center;padding:30px 10px 50px;color:var(--mu);font:500 .72rem 'JetBrains Mono',monospace}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(max-width:820px){.hg,.bento{grid-template-columns:1fr}.hero{min-height:auto}.logo{display:none}.pills{margin-left:0;flex:1}.pills a{flex:1;text-align:center;padding:7px 4px}.bento .pf{grid-row:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* ===== HEADER BARU ===== */
.hd{position:sticky;top:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--bd)}
.hr1{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}.bm{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:800 1.2rem Syne,sans-serif;color:#06121c;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 22px var(--gl)}
.bt b{display:block;font:700 .95rem Syne,sans-serif;line-height:1.1}.bt small{font:500 .64rem 'JetBrains Mono',monospace;color:var(--ac);letter-spacing:.08em}
.seg{position:relative;display:flex;padding:4px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--bd)}
.seg a{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:11px;font-weight:700;font-size:.84rem;color:var(--mu);transition:color .3s}.seg a.on{color:#06121c}
.knob{position:absolute;top:4px;bottom:4px;left:4px;width:80px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:left .4s cubic-bezier(.4,1.3,.5,1),width .4s;box-shadow:0 4px 16px var(--gl)}
.tg{width:42px;height:42px;border-radius:13px;font-size:1.1rem;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx)}.tg:hover{border-color:var(--ac)}
.hr2{max-width:1180px;margin:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 18px 8px}
.hr2 a{white-space:nowrap;padding:6px 14px;border-radius:9px;font-weight:600;font-size:.78rem;color:var(--mu);transition:.25s}.hr2 a:hover{color:var(--tx);background:rgba(255,255,255,.06)}.hr2 a.on{color:var(--ac);background:var(--gl)}
.pg{height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;transition:width .1s}
section{scroll-margin-top:110px}
/* ===== GALERI, PRATINJAU, VIDEO ===== */
.dc,.vc{display:flex;flex-direction:column}.cv{height:130px;border-radius:16px;margin-bottom:14px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,var(--gl),rgba(255,255,255,.04));border:1px solid var(--bd)}
.dc h4,.vc h4{font:700 1rem Syne,sans-serif;margin-bottom:4px}.dc .bx{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}.dc .bx .btn{margin:10px 0 0}
.vp{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;margin-bottom:14px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,rgba(0,0,0,.5),var(--gl));border:1px solid var(--bd)}.vp iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vp .pl{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#06121c;margin:0 auto;box-shadow:0 0 30px var(--gl);cursor:pointer;border:0}
.bdg{display:inline-block;font:500 .64rem 'JetBrains Mono',monospace;padding:3px 10px;border-radius:99px;background:var(--gl);color:var(--ac);margin-bottom:8px}
.md{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,15,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.md.on{display:flex}
.mb{width:min(1000px,100%);height:min(88vh,900px);display:flex;flex-direction:column;border-radius:22px;background:var(--bg2);border:1px solid var(--bd);overflow:hidden}.mb.fs{width:100%;height:100%;border-radius:0}
.mt{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd)}.mt b{margin-right:auto;font:700 .95rem Syne,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt button,.mt a{padding:7px 12px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);font-size:.78rem;font-weight:600}.mt button:hover,.mt a:hover{border-color:var(--ac);color:var(--ac)}
.mf{position:relative;flex:1;background:#0003}.mf iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.mf .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-size:.9rem;text-align:center;padding:20px}
.mh{padding:8px 16px;font-size:.74rem;color:var(--mu);border-top:1px solid var(--bd)}
.bt2{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font-size:1.2rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none}.bt2.on{display:block}
@media(max-width:700px){.bt{display:none}.seg a{padding:8px 11px}.hr1{gap:8px;padding:8px 12px}.tg{width:38px;height:38px}}
